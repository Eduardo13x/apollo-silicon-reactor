# Apollo Optimizer - local configuration
# Install with:
#   sudo mkdir -p /etc/apollo-optimizer
#   sudo cp apollo-optimizer.toml /etc/apollo-optimizer/config.toml

[history]
# Per-cycle telemetry archive used by the local World Model and router.
enabled = true
# Rotate the live file near 100 MB and keep disk usage bounded.
rotation_max_bytes = 104857600
rotation_max_files = 2
